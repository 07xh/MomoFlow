      - name: Commit restored Android source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md THIRD_PARTY_NOTICES.md MOBILE_BUILD.md .gitignore app build.gradle.kts settings.gradle.kts gradle.properties docs licenses tools .github/workflows/android.yml
          if ! git diff --cached --quiet; then
            git commit -m "feat: import MomoFlow Android v0.4.0 source"
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate source
        run: python3 tools/verify_source.py
      - name: Unit tests and build APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MomoFlow-v0.4.0-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MomoFlow-v0.4.0-build-log
          path: |
            build.log
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn