name: MomoFlow Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Source checks
        run: python3 tools/verify_source.py
      - name: Tests and APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MomoFlow-v0.4.0-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MomoFlow-v0.4.0-build-log
          path: |
            build.log
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
