name: MomoFlow Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Source checks
        run: python3 tools/verify_source.py

      - name: Build debug APK
        id: apk
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:assembleDebug --stacktrace 2>&1 | tee apk-build.log

      - name: Upload APK
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MomoFlow-v0.4.0-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unit tests
        if: steps.apk.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:testDebugUnitTest --stacktrace 2>&1 | tee tests.log

      - name: Summarize failure
        if: failure()
        shell: bash
        run: |
          {
            echo '## MomoFlow build failed'
            echo 'Check the first red step above. The last Gradle failure lines are shown below.'
            for file in apk-build.log tests.log; do
              if [ -f "$file" ]; then
                echo
                echo "### $file"
                echo '~~~'
                grep -E '(^e: |^> Task .*FAILED|^FAILURE:|^\* What went wrong:|^Execution failed for|^Could not |^Caused by:|^\s*error:)' "$file" | tail -n 60 || true
                echo '~~~'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MomoFlow-build-diagnostics
          path: |
            apk-build.log
            tests.log
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
