name: MomoFlow Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub Ubuntu runners already provide Android SDK command-line tools.
      # setup-android@v3 currently tries to install obsolete SDK package "tools" and fails.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Verify Android SDK 36
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [[ ! -f "$SDK_ROOT/platforms/android-36/android.jar" || ! -x "$SDK_ROOT/build-tools/36.0.0/aapt2" ]]; then
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install 'platforms;android-36' 'build-tools;36.0.0'
          fi
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt2"
          echo "Android SDK 36 and Build Tools 36.0.0 ready"

      - name: Source checks
        id: source
        run: python3 tools/verify_source.py

      - name: Generate bundled ECDICT definitions
        id: dictionary
        run: python3 tools/build_dictionary.py

      - name: Build debug APK
        id: apk
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:assembleDebug --stacktrace 2>&1 | tee apk-build.log

      - name: Upload APK
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MomoFlow-v0.5.1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unit tests
        id: test
        if: steps.apk.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:testDebugUnitTest --stacktrace 2>&1 | tee tests.log

      - name: Confirm verified build in CI issue
        if: success() && contains(github.event.head_commit.message, '[verify]')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh issue comment 1 --body "✅ MomoFlow 0.5.1 APK 构建与单元测试成功。Commit: ${GITHUB_SHA}. 运行记录: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Summarize failure
        if: failure()
        shell: bash
        run: |
          {
            echo '## MomoFlow build failed'
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo 'Check the first red step above.'
            for file in apk-build.log tests.log; do
              if [ -f "$file" ]; then
                echo
                echo "### $file"
                echo '~~~'
                grep -E '(^e: |^> Task .*FAILED|^FAILURE:|^\\* What went wrong:|^Execution failed for|^Could not |^Caused by:|error:)' "$file" | tail -n 70 || true
                echo '~~~'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record failure diagnostics for remote debugging
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "### Failed workflow run #${GITHUB_RUN_NUMBER}"
            echo
            echo "Run URL: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'Step outcomes:'
            echo '- Install SDK: ${{ steps.sdk.outcome }}'
            echo '- Source checks: ${{ steps.source.outcome }}'
            echo '- ECDICT dictionary: ${{ steps.dictionary.outcome }}'
            echo '- Build APK: ${{ steps.apk.outcome }}'
            echo '- Unit tests: ${{ steps.test.outcome }}'
            for file in apk-build.log tests.log; do
              if [ -f "$file" ]; then
                echo
                echo "#### $file (last 100 lines)"
                echo '~~~'
                tail -n 100 "$file" | sed -E 's/gh[pousr]_[A-Za-z0-9_]+/[REDACTED]/g'
                echo '~~~'
              fi
            done
          } > /tmp/momoflow-ci-failure.md
          issue_number="$(gh issue list --state open --search 'MomoFlow CI failure diagnostics in:title' --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file /tmp/momoflow-ci-failure.md
          else
            gh issue create --title "MomoFlow CI failure diagnostics" --body-file /tmp/momoflow-ci-failure.md
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MomoFlow-build-diagnostics
          path: |
            apk-build.log
            tests.log
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
